[project]
name = "lighthouse"
version = "0.1.0"
description = "Lighthouse: governance layer that reconciles Finance, Sales, Operations and Legal agent recommendations (capstone prototype)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.6",
]

[project.scripts]
lighthouse = "lighthouse.cli:main"

[project.optional-dependencies]
llm = ["ollama>=0.5"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lighthouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
